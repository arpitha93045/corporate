<div class="auth-page">
  <section class="card auth-card">
    <h1>Sign in</h1>
    <p class="muted">Welcome back. Sign in to place orders and track them.</p>

    @if (resetDone) {
      <p class="muted">Your password has been reset. Sign in with your new password.</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <div>
        <label>Email</label>
        <input type="email" formControlName="email" autocomplete="email" />
      </div>
      <div>
        <label>Password</label>
        <input type="password" formControlName="password" autocomplete="current-password" />
      </div>

      @if (errorMsg()) {
        <p class="error">{{ errorMsg() }}</p>
      }

      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="muted small">
      <a routerLink="/forgot-password">Forgot password?</a>
    </p>
    <p class="muted small">
      New here?
      <a routerLink="/signup" [queryParams]="redirectQuery">Create an account</a>.
    </p>
  </section>
</div>
