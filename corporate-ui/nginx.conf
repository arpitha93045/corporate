# SPA served by nginx. This container is the single web entrypoint: it serves
# static assets, provides the client-side-routing deep-link fallback, and
# proxies /api and /actuator to the backend. The TLS-terminating edge proxy
# (Caddy locally, Coolify's Traefik in prod) only routes the public domain here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Backend API + actuator. Docker's network resolves "backend" to the Spring
    # Boot service; proxy headers preserve the real client IP so the backend's
    # per-IP rate limiting stays accurate (it trusts X-Forwarded-For).
    location ~ ^/(api|actuator)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are immutable — cache them hard.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths resolve to index.html so client-side routes
    # (/quote/:token, /order/:n, /pay/:n, /products/:slug) survive a reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
