# SPA served by nginx. /api and /actuator are routed to the backend by the
# edge proxy (Caddy) — this container only serves static assets and provides
# the client-side-routing fallback for deep links.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable — cache them hard.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths resolve to index.html so client-side routes
    # (/quote/:token, /order/:n, /pay/:n, /products/:slug) survive a reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
