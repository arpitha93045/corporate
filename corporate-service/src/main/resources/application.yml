spring:
  application:
    name: corporate-gifting

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-this-is-a-32-byte-default-secret-key!!}
    ttl-seconds: ${JWT_TTL_SECONDS:86400}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@corporate-gifting.local}
    enquiries-to: ${MAIL_ENQUIRIES_TO:enquiries@corporate-gifting.local}
  ratelimit:
    trust-forwarded-for: ${RATELIMIT_TRUST_FORWARDED_FOR:false}
  stripe:
    # Stripe test keys start "sk_test_"; live keys start "sk_live_". The default
    # here is the sentinel value that PaymentsConfig refuses to boot with on
    # the prod profile.
    secret-key: ${STRIPE_SECRET_KEY:sk_test_replace_me}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_replace_me}
    currency: ${STRIPE_CURRENCY:inr}
  agent:
    # AI Gifting Agent. Disabled by default and inert without an API key —
    # POST /api/agent/chat returns 503 until AGENT_ENABLED=true and a key is set.
    enabled: ${AGENT_ENABLED:false}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AGENT_MODEL:claude-sonnet-4-6}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    max-tokens: ${AGENT_MAX_TOKENS:1024}
    max-tool-iterations: ${AGENT_MAX_TOOL_ITERATIONS:6}
  admin:
    # If set, the user with this email is promoted to ADMIN on each boot.
    # They must have signed up first — this bootstrap only bumps the role.
    email: ${APP_ADMIN_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Never expose component-level details to anonymous callers — a bare
      # UP/DOWN is enough for load balancers and k8s probes.
      show-details: never
      show-components: never
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/corporate
    username: corporate
    password: corporate
    driver-class-name: org.postgresql.Driver

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:corporate;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
