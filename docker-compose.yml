# Prod-like stack: Postgres + Spring Boot backend + Angular (nginx) frontend,
# all behind a Caddy edge proxy that terminates TLS (automatic HTTPS).
#
# Configure via a root .env file (see .env.example). Bring it up with:
#   docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: corporate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corporate}
      POSTGRES_USER: ${POSTGRES_USER:-corporate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corporate}
    # No host port published: only the backend reaches Postgres over the
    # internal network. Add a "5432:5432" mapping locally if you need direct DB
    # access for debugging.
    volumes:
      - corporate_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corporate} -d ${POSTGRES_DB:-corporate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./corporate-service
    container_name: corporate-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-corporate}
      DATABASE_USER: ${POSTGRES_USER:-corporate}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-corporate}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-86400}
      APP_BASE_URL: ${APP_BASE_URL}
      # Caddy terminates TLS and forwards the real client IP; trust it so
      # per-IP rate limiting is accurate.
      RATELIMIT_TRUST_FORWARDED_FOR: "true"
      # Stripe: prod refuses to boot with the placeholder keys.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-inr}
      # Mail (optional; disabled unless MAIL_ENABLED=true).
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_ENQUIRIES_TO: ${MAIL_ENQUIRIES_TO:-}
      # Admin bootstrap (optional): promotes this already-registered user.
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      # AI agent (optional; inert without a key).
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-sonnet-4-6}

  frontend:
    build: ./corporate-ui
    container_name: corporate-frontend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: corporate-caddy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  corporate_pg_data:
  caddy_data:
  caddy_config:
