services:
  postgres:
    image: postgres:16-alpine
    container_name: corporate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: corporate
      POSTGRES_USER: corporate
      POSTGRES_PASSWORD: corporate
    ports:
      - "5432:5432"
    volumes:
      - corporate_pg_data:/var/lib/postgresql/data

volumes:
  corporate_pg_data:
